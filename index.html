<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Galaxy Login Experience</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #030014;
            color: #ffffff;
            overflow: hidden;
        }

        /* Glassmorphism card effect */
        .glass-card {
            background: rgba(15, 12, 41, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37),
                        inset 0 0 15px rgba(120, 119, 198, 0.15);
        }

        /* Neon Glow Effects */
        .glow-button {
            background: linear-gradient(135deg, #7928CA 0%, #FF0080 100%);
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.4);
            transition: all 0.3s ease;
        }

        .glow-button:hover {
            box-shadow: 0 0 35px rgba(255, 0, 128, 0.8),
                        0 0 10px rgba(121, 40, 202, 0.6);
            transform: translateY(-2px) scale(1.02);
        }

        .glow-border {
            position: relative;
        }

        .glow-border::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #00f2fe, #ff0080);
            border-radius: inherit;
            z-index: -1;
            opacity: 0.7;
            filter: blur(8px);
            animation: borderGlow 6s linear infinite;
        }

        @keyframes borderGlow {
            0% { filter: blur(8px) hue-rotate(0deg); }
            100% { filter: blur(8px) hue-rotate(360deg); }
        }

        /* Custom Input styling */
        .space-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .space-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            outline: none;
        }

        /* Transition FX */
        .fade-out-up {
            animation: fadeOutUp 1s forwards cubic-bezier(0.16, 1, 0.3, 1);
        }

        .fade-in-scale {
            animation: fadeInScale 1.2s forwards cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeOutUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.9); visibility: hidden; }
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Custom Audio Progress Bar */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ec4899;
            cursor: pointer;
            box-shadow: 0 0 8px #ec4899;
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex items-center justify-center p-4">

    <!-- Cosmic Background Canvas -->
    <canvas id="spaceCanvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none"></canvas>

    <!-- Nebulae background overlays -->
    <div class="fixed top-1/4 left-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-pink-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- LOGIN CONTAINER -->
    <div id="loginCard" class="relative z-10 w-full max-w-md p-8 sm:p-10 rounded-3xl glass-card text-center transition-all duration-500">
        <!-- Floating Logo Icon -->
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-pink-500 mb-6 shadow-lg shadow-purple-500/30">
            <i class="fa-solid fa-rocket text-2xl text-white"></i>
        </div>

        <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-purple-300 mb-2">
            The galaxy
        </h1>
        <p class="text-xs text-slate-400 mb-8 tracking-widest uppercase">please login</p>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <!-- Username Input -->
            <div class="relative text-left">
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2 ml-1">username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="text" id="username" required placeholder="..." 
                        class="w-full pl-11 pr-4 py-3.5 rounded-xl space-input text-sm text-white placeholder-slate-500 focus:outline-none">
                </div>
            </div>

            <!-- Password Input -->
            <div class="relative text-left">
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2 ml-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full pl-11 pr-4 py-3.5 rounded-xl space-input text-sm text-white placeholder-slate-500 focus:outline-none">
                </div>
            </div>

            <!-- Login Button -->
            <button type="submit" 
                class="w-full py-4 mt-2 rounded-xl text-white font-semibold text-sm tracking-wider uppercase glow-button flex items-center justify-center gap-2 cursor-pointer">
                <span>LOGIN</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

    <!-- DISPLAY RESULT CONTAINER (Initially Hidden) -->
    <div id="resultCard" class="hidden relative z-10 w-full max-w-lg p-6 sm:p-8 rounded-3xl glass-card text-center flex-col items-center justify-center">
        <!-- Title -->
        <h2 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-400 to-purple-300 mb-4">
            HAHAHAHAHAAHAHAHAHAHAHA
        </h2>

        <!-- Glow Image Frame -->
        <div class="glow-border rounded-2xl mb-6 overflow-hidden max-w-full">
            <img id="leuImage" src="leuleu.jpg" alt="leuleu image" 
                 onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e1b4b/e0e7ff?text=leuleu.jpg+Not+Found';"
                 class="w-full max-h-[380px] object-cover rounded-2xl transform hover:scale-105 transition-transform duration-500">
        </div>

        <!-- Custom Galaxy Audio Player -->
        <div class="w-full bg-slate-900/60 p-4 rounded-2xl border border-white/10 backdrop-blur-md">
            <audio id="leuAudio" preload="auto">
                <source src="leuleu.mp3" type="audio/mpeg">
                Trình duyệt của bạn không hỗ trợ thẻ audio.
            </audio>

            <div class="flex items-center justify-between gap-4">
                <!-- Play/Pause Button -->
                <button id="playBtn" onclick="toggleAudio()" class="w-12 h-12 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 flex items-center justify-center text-white text-lg shadow-lg shadow-pink-500/30 hover:scale-110 active:scale-95 transition-all">
                    <i id="playIcon" class="fa-solid fa-pause"></i>
                </button>

                <!-- Audio Info & Progress Bar -->
                <div class="flex-1 text-left">
                    <div class="flex justify-between items-center text-xs text-slate-300 mb-1">
                        <span class="font-medium text-pink-300 truncate max-w-[150px]">leuleu.mp3</span>
                        <span id="timeDisplay">0:00 / 0:00</span>
                    </div>
                    <input type="range" id="audioSeek" value="0" min="0" step="0.1" onchange="seekAudio()"
                           class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-pink-500">
                </div>

                <!-- Mute/Volume Toggle -->
                <button onclick="toggleMute()" class="text-slate-400 hover:text-white transition-colors p-2">
                    <i id="volumeIcon" class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </div>

        <!-- Re-login Button -->
        <button onclick="resetLogin()" class="mt-6 text-xs text-slate-400 hover:text-white underline transition-colors">
             Quay lại màn hình đăng nhập
        </button>
    </div>

    <script>
        // --- 1. STARFIELD CANVAS ANIMATION ---
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            stars = [];
            const numStars = Math.floor((width * height) / 2500);

            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005,
                    sizeChange: Math.random() * 0.01
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, width, height);

            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) {
                    star.speed = -star.speed;
                }

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
                ctx.shadowBlur = star.radius * 3;
                ctx.shadowColor = '#ffffff';
                ctx.fill();
            });

            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        drawStars();

        // --- 2. LOGIN & MEDIA TOGGLE LOGIC ---
        const loginCard = document.getElementById('loginCard');
        const resultCard = document.getElementById('resultCard');
        const audio = document.getElementById('leuAudio');
        const playIcon = document.getElementById('playIcon');
        const audioSeek = document.getElementById('audioSeek');
        const timeDisplay = document.getElementById('timeDisplay');
        const volumeIcon = document.getElementById('volumeIcon');

        function handleLogin(event) {
            event.preventDefault();

            // Transition out login form
            loginCard.classList.add('fade-out-up');

            setTimeout(() => {
                loginCard.classList.add('hidden');
                loginCard.classList.remove('fade-out-up');

                // Transition in result view
                resultCard.classList.remove('hidden');
                resultCard.classList.add('flex', 'fade-in-scale');

                // Play Audio automatically
                audio.play().then(() => {
                    playIcon.className = "fa-solid fa-pause";
                }).catch(err => {
                    console.log("Autoplay failed due to browser policy, user interaction ready.", err);
                    playIcon.className = "fa-solid fa-play";
                });

            }, 800);
        }

        function resetLogin() {
            audio.pause();
            audio.currentTime = 0;

            resultCard.classList.add('hidden');
            resultCard.classList.remove('flex', 'fade-in-scale');

            loginCard.classList.remove('hidden');
            loginCard.classList.add('fade-in-scale');
        }

        // --- 3. AUDIO PLAYER CONTROL LOGIC ---
        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                playIcon.className = "fa-solid fa-pause";
            } else {
                audio.pause();
                playIcon.className = "fa-solid fa-play";
            }
        }

        function toggleMute() {
            audio.muted = !audio.muted;
            if (audio.muted) {
                volumeIcon.className = "fa-solid fa-volume-xmark text-pink-400";
            } else {
                volumeIcon.className = "fa-solid fa-volume-high";
            }
        }

        audio.addEventListener('loadedmetadata', () => {
            audioSeek.max = audio.duration;
            updateTimeDisplay();
        });

        audio.addEventListener('timeupdate', () => {
            audioSeek.value = audio.currentTime;
            updateTimeDisplay();
        });

        audio.addEventListener('ended', () => {
            playIcon.className = "fa-solid fa-play";
        });

        function seekAudio() {
            audio.currentTime = audioSeek.value;
        }

        function updateTimeDisplay() {
            const current = formatTime(audio.currentTime);
            const total = isNaN(audio.duration) ? "0:00" : formatTime(audio.duration);
            timeDisplay.innerText = `${current} / ${total}`;
        }

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }
    </script>
</body>
</html>
